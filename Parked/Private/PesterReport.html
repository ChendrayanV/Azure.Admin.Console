<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('aac-data').textContent);
  var tests = D.tests;
  var PAGE = 200;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function fmt(n) { return Number(n).toLocaleString(); }
  function dur(ms) {
    if (ms < 1000) return Math.round(ms) + ' ms';
    if (ms < 60000) return (ms / 1000).toFixed(2) + ' s';
    return (ms / 60000).toFixed(1) + ' min';
  }
  function plural(n, one, many) { return fmt(n) + ' ' + (n === 1 ? one : (many || one + 's')); }

  // --- Theme (remembered per browser) -------------------------------------------------
  var root = document.documentElement;
  function storeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  var savedTheme = storeGet('aac-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') root.setAttribute('data-theme', savedTheme);
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintThemeButton() { $('theme').textContent = isDark() ? '☀ Light' : '☾ Dark'; }
  $('theme').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    storeSet('aac-theme', next);
    paintThemeButton();
  });
  paintThemeButton();

  // --- Header, verdict, tiles -----------------------------------------------------------
  var c = D.counts;
  document.title = D.title;
  $('title').textContent = D.title;
  var sub = [plural(c.total, 'test') + ' in ' + plural(D.files.length, 'file'), 'ran for ' + dur(D.durationMs), 'generated ' + new Date(D.generated).toLocaleString()];
  if (D.account) sub.push(D.account);
  $('subtitle').textContent = sub.join('  ·  ');

  var v = $('verdict');
  var vIcon = el('span', 'icon'), vText = el('div');
  var head, note;
  if (c.failed > 0) { v.classList.add('failed'); vIcon.textContent = '✕'; head = 'FAILED'; note = plural(c.failed, 'test') + ' of ' + fmt(c.total) + ' failed'; }
  else if (c.total === 0) { v.classList.add('neutral'); vIcon.textContent = '!'; head = 'NO TESTS RAN'; note = 'Nothing matched the chosen tests.'; }
  else if (c.passed === 0) { v.classList.add('neutral'); vIcon.textContent = '!'; head = 'SKIPPED'; note = 'All ' + plural(c.skipped, 'test') + ' were skipped'; }
  else { v.classList.add('passed'); vIcon.textContent = '✓'; head = 'PASSED'; note = 'All ' + plural(c.passed, 'test') + ' passed' + (c.skipped ? ', ' + fmt(c.skipped) + ' skipped' : ''); }
  vText.appendChild(document.createTextNode(head));
  vText.appendChild(el('small', null, note));
  v.appendChild(vIcon); v.appendChild(vText);

  var decided = c.passed + c.failed;
  var rate = decided ? (100 * c.passed / decided).toFixed(1) + '%' : '–';
  var tileDefs = [
    { k: 'all', n: fmt(c.total), l: 'tests run', cls: '' },
    { k: 'Passed', n: fmt(c.passed), l: 'passed', cls: 't-pass' + (c.passed ? '' : ' zero') },
    { k: 'Failed', n: fmt(c.failed), l: 'failed', cls: 't-fail' + (c.failed ? '' : ' zero') },
    { k: 'Skipped', n: fmt(c.skipped), l: 'skipped', cls: 't-skip' + (c.skipped ? '' : ' zero') },
    { k: 'rate', n: rate, l: 'pass rate (passed / passed + failed)', cls: 't-rate' }
  ];
  tileDefs.forEach(function (t) {
    var b = el('button', 'tile ' + t.cls);
    b.type = 'button';
    b.dataset.k = t.k;
    b.appendChild(el('div', 'n', t.n));
    b.appendChild(el('div', 'l', t.l));
    b.addEventListener('click', function () {
      if (t.k === 'rate') return;
      state.outcome = t.k;
      apply(true);
      $('toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    $('tiles').appendChild(b);
  });
  if (c.total > 0) {
    [['p', c.passed, 'Passed'], ['f', c.failed, 'Failed'], ['s', c.skipped, 'Skipped']].forEach(function (x) {
      if (!x[1]) return;
      var s = el('span', x[0]); s.style.width = (100 * x[1] / c.total) + '%'; s.title = x[2] + ': ' + fmt(x[1]);
      $('bar').appendChild(s);
      var li = el('span'); var sw = el('i'); sw.style.background = 'var(--' + { p: 'pass', f: 'fail', s: 'skip' }[x[0]] + '-bar)';
      li.appendChild(sw); li.appendChild(document.createTextNode(x[2] + ' ' + fmt(x[1]) + ' (' + (100 * x[1] / c.total).toFixed(1) + '%)'));
      $('legend').appendChild(li);
    });
  }

  // --- Insights: where the failures are ------------------------------------------------------
  function topCounts(key, limit) {
    var m = new Map();
    tests.forEach(function (t) {
      if (t.result !== 'Failed') return;
      var k = key(t); if (!k) return;
      m.set(k, (m.get(k) || 0) + 1);
    });
    return Array.from(m.entries()).sort(function (a, b) { return b[1] - a[1] || String(a[0]).localeCompare(String(b[0])); }).slice(0, limit);
  }
  function barCard(title, rows, onPick, emptyText) {
    var card = el('div', 'card');
    card.appendChild(el('h2', null, title));
    if (!rows.length) { card.appendChild(el('div', 'empty-note', emptyText)); return card; }
    var max = rows[0][1];
    rows.forEach(function (r) {
      var b = el('button', 'hbar'); b.type = 'button'; b.title = r[0];
      b.appendChild(el('span', 'name', r[0]));
      b.appendChild(el('span', 'count', fmt(r[1])));
      var tr = el('span', 'track'); var fill = el('span'); fill.style.width = Math.max(3, 100 * r[1] / max) + '%'; tr.appendChild(fill); b.appendChild(tr);
      b.addEventListener('click', function () { onPick(r[0]); });
      card.appendChild(b);
    });
    return card;
  }
  function pick(text) {
    state.q = text; state.outcome = 'Failed';
    $('q').value = text;
    apply(true);
    $('toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  var hasResources = tests.some(function (t) { return t.resourceId; });
  var insights = $('insights');
  if (D.onlyFailedListed && c.failed === 0) {
    // Nothing failed and nothing else is listed: skip the charts.
  } else {
    insights.appendChild(barCard('Failures by area', topCounts(function (t) { return t.block; }, 8), pick, 'No failures.'));
    insights.appendChild(barCard('Checks that fail most', topCounts(function (t) { return t.check || t.block; }, 8), pick, 'No failures.'));
    if (hasResources) insights.appendChild(barCard('Resources with most failures', topCounts(function (t) { return t.resource; }, 8), pick, 'No failures.'));
  }
  var factCard = el('div', 'card wide');
  factCard.appendChild(el('h2', null, 'This run'));
  var dl = el('dl', 'facts');
  D.facts.forEach(function (f) { dl.appendChild(el('dt', null, f.k)); dl.appendChild(el('dd', null, f.v)); });
  factCard.appendChild(dl);
  insights.appendChild(factCard);

  // --- Toolbar ------------------------------------------------------------------------------------
  var state = { q: '', outcome: 'all', groupBy: 'check', sev: '' };
  var counts = { all: tests.length, Failed: 0, Passed: 0, Skipped: 0 };
  tests.forEach(function (t) { if (counts[t.result] !== undefined) counts[t.result]++; });
  var chipDefs = [['all', 'All', ''], ['Failed', 'Failed', 'f'], ['Passed', 'Passed', 'p'], ['Skipped', 'Skipped', 's']];
  chipDefs.forEach(function (d) {
    if (d[0] !== 'all' && !counts[d[0]]) return;
    var b = el('button', 'chip ' + d[2]); b.type = 'button'; b.dataset.k = d[0];
    b.appendChild(document.createTextNode(d[1]));
    b.appendChild(el('span', 'c', fmt(counts[d[0]])));
    b.addEventListener('click', function () { state.outcome = d[0]; apply(true); });
    $('chips').appendChild(b);
  });
  var groupDefs = [['check', 'By check']];
  if (hasResources) groupDefs.push(['resource', 'By resource']);
  groupDefs.push(['file', 'By file']);
  groupDefs.forEach(function (d) {
    var b = el('button', 'chip'); b.type = 'button'; b.dataset.k = d[0]; b.textContent = d[1];
    b.addEventListener('click', function () { state.groupBy = d[0]; apply(true); });
    $('groupby').appendChild(b);
  });
  var severities = Array.from(new Set(tests.map(function (t) { return t.severity; }).filter(Boolean))).sort();
  if (severities.length > 1) {
    var sel = $('sev'); sel.hidden = false;
    [['', 'Any severity']].concat(severities.map(function (s) { return [s, s]; })).forEach(function (o) {
      var op = el('option', null, o[1]); op.value = o[0]; sel.appendChild(op);
    });
    sel.addEventListener('change', function () { state.sev = sel.value; apply(true); });
  }
  var qTimer;
  $('q').addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = $('q').value.trim(); apply(true); }, 140);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; state.q = ''; apply(true); }
  });
  $('expand').addEventListener('click', function () { document.querySelectorAll('details.group').forEach(function (d) { d.open = true; }); });
  $('collapse').addEventListener('click', function () { document.querySelectorAll('details.group').forEach(function (d) { d.open = false; }); });

  // --- State in the URL, so a filtered view can be shared ------------------------------------
  function readHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('='); if (i < 0) return;
      var k = kv.slice(0, i), val = decodeURIComponent(kv.slice(i + 1));
      if (k === 'q') state.q = val;
      if (k === 'o' && ['all', 'Failed', 'Passed', 'Skipped'].indexOf(val) >= 0) state.outcome = val;
      if (k === 'g' && groupDefs.some(function (d) { return d[0] === val; })) state.groupBy = val;
      if (k === 's') state.sev = val;
    });
    $('q').value = state.q;
    if (state.sev && $('sev')) $('sev').value = state.sev;
  }
  function writeHash() {
    var parts = [];
    if (state.q) parts.push('q=' + encodeURIComponent(state.q));
    if (state.outcome !== 'all') parts.push('o=' + state.outcome);
    if (state.groupBy !== 'check') parts.push('g=' + state.groupBy);
    if (state.sev) parts.push('s=' + encodeURIComponent(state.sev));
    var h = parts.length ? '#' + parts.join('&') : '';
    if (h !== location.hash) history.replaceState(null, '', h || location.pathname + location.search);
  }

  // --- Filtering and grouping -------------------------------------------------------------------
  tests.forEach(function (t) {
    t._hay = [t.name, t.block, t.check, t.file, t.resource, t.resourceType, t.rg, t.subscription, t.rule, t.message, t.severity, t.pillar].join('\n').toLowerCase();
  });
  function matches(t) {
    if (state.outcome !== 'all' && t.result !== state.outcome) return false;
    if (state.sev && t.severity !== state.sev) return false;
    if (state.q) {
      var terms = state.q.toLowerCase().split(/\s+/);
      for (var i = 0; i < terms.length; i++) if (terms[i] && t._hay.indexOf(terms[i]) < 0) return false;
    }
    return true;
  }
  function groupKey(t) {
    if (state.groupBy === 'resource') return t.resourceId ? t.resourceId.toLowerCase() : '(no resource) ' + t.block;
    if (state.groupBy === 'file') return t.file;
    return t.file + '\u0000' + t.block + '\u0000' + (t.check || '');
  }

  function highlight(parent, text) {
    text = text == null ? '' : String(text);
    var terms = state.q ? state.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
    if (!terms.length) { parent.appendChild(document.createTextNode(text)); return; }
    var lower = text.toLowerCase(), i = 0;
    while (i < text.length) {
      var best = -1, len = 0;
      terms.forEach(function (term) { var j = lower.indexOf(term, i); if (j >= 0 && (best < 0 || j < best)) { best = j; len = term.length; } });
      if (best < 0) { parent.appendChild(document.createTextNode(text.slice(i))); break; }
      if (best > i) parent.appendChild(document.createTextNode(text.slice(i, best)));
      parent.appendChild(el('mark', null, text.slice(best, best + len)));
      i = best + len;
    }
  }
  function portalUrl(id) { return 'https://portal.azure.com/#' + (D.tenantId ? '@' + D.tenantId + '/' : '') + 'resource' + id; }
  var toastTimer;
  function toast(text) {
    var t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }
  function copy(text) {
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Could not copy'); }
      ta.remove();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    else fallback();
  }

  function testRow(t) {
    var row = el('div', 't');
    row.appendChild(el('div', 'badge ' + t.result, { Passed: 'PASS', Failed: 'FAIL', Skipped: 'SKIP' }[t.result] || t.result.toUpperCase()));
    var main = el('div', 'main');
    var tn = el('div', 'tn'); highlight(tn, t.name); main.appendChild(tn);
    var meta = el('div', 'meta');
    function m(label, value) { if (!value) return; var s = el('span'); s.title = label; highlight(s, value); meta.appendChild(s); }
    if (state.groupBy === 'resource') { m('Check', t.check || t.block); }
    else {
      m('Resource type', t.resourceType); m('Resource group', t.rg); m('Subscription', t.subscription);
    }
    if (t.severity && state.groupBy !== 'check') m('Severity', t.severity);
    if (meta.childNodes.length) main.appendChild(meta);
    if (t.message) {
      var msg = el('div', 'msg' + (t.result === 'Failed' ? '' : ' skip'));
      highlight(msg, t.message);
      if (t.message.split('\n').length > 5 || t.message.length > 420) msg.classList.add('long');
      msg.title = 'Click to show all';
      msg.addEventListener('click', function () { msg.classList.toggle('open'); });
      main.appendChild(msg);
    }
    row.appendChild(main);
    var acts = el('div', 'acts');
    if (t.resourceId) {
      var a = el('a', 'act', 'Portal ↗'); a.href = portalUrl(t.resourceId); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = 'Open ' + t.resourceId + ' in the Azure portal';
      acts.appendChild(a);
      var cp = el('button', 'act', 'Copy ID'); cp.type = 'button'; cp.title = t.resourceId;
      cp.addEventListener('click', function () { copy(t.resourceId); });
      acts.appendChild(cp);
    }
    if (t.ruleLink && state.groupBy !== 'check') {
      var r = el('a', 'act', 'Rule ↗'); r.href = t.ruleLink; r.target = '_blank'; r.rel = 'noopener noreferrer'; r.title = t.rule;
      acts.appendChild(r);
    }
    acts.appendChild(el('span', 'time', dur(t.ms)));
    row.appendChild(acts);
    return row;
  }

  function renderBody(g, body) {
    body.textContent = '';
    var first = g.items[0];
    if (state.groupBy === 'check' && first.recommendation) {
      var note = el('div', 'g-note');
      note.appendChild(el('b', null, 'Recommendation: '));
      note.appendChild(document.createTextNode(first.recommendation));
      body.appendChild(note);
    }
    var shown = 0;
    function more() {
      var end = Math.min(g.items.length, shown + PAGE);
      var frag = document.createDocumentFragment();
      for (; shown < end; shown++) frag.appendChild(testRow(g.items[shown]));
      body.insertBefore(frag, moreRow);
      if (shown >= g.items.length) moreRow.remove();
      else moreBtn.textContent = 'Show ' + fmt(Math.min(PAGE, g.items.length - shown)) + ' more of ' + fmt(g.items.length - shown);
    }
    var moreRow = el('div', 'more-row'), moreBtn = el('button', 'tool-btn');
    moreBtn.type = 'button'; moreBtn.addEventListener('click', more);
    moreRow.appendChild(moreBtn); body.appendChild(moreRow);
    more();
  }

  function groupCard(g, openIt) {
    var d = el('details', 'group');
    var s = el('summary');
    s.appendChild((function () { var c2 = el('span', 'chev'); c2.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'; return c2; })());
    var title = el('div', 'g-title');
    if (g.crumb) { var cr = el('div', 'crumb'); highlight(cr, g.crumb); title.appendChild(cr); }
    var nm = el('div', 'name'); highlight(nm, g.title);
    if (g.link) { var a = el('a', null, 'rule docs ↗'); a.href = g.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.addEventListener('click', function (e) { e.stopPropagation(); }); nm.appendChild(a); }
    if (g.portal) { var p = el('a', null, 'portal ↗'); p.href = portalUrl(g.portal); p.target = '_blank'; p.rel = 'noopener noreferrer'; p.addEventListener('click', function (e) { e.stopPropagation(); }); nm.appendChild(p); }
    title.appendChild(nm);
    s.appendChild(title);
    var side = el('div', 'g-side');
    if (g.severity) side.appendChild(el('span', 'pill sev', g.severity));
    if (g.f) side.appendChild(el('span', 'pill f', fmt(g.f) + ' failed'));
    if (g.p) side.appendChild(el('span', 'pill p', fmt(g.p) + ' passed'));
    if (g.s) side.appendChild(el('span', 'pill s', fmt(g.s) + ' skipped'));
    if (g.p + g.f > 0) { var mini = el('span', 'mini'); mini.title = Math.round(100 * g.p / (g.p + g.f)) + '% passed'; var fill = el('span'); fill.style.width = (100 * g.p / (g.p + g.f)) + '%'; mini.appendChild(fill); side.appendChild(mini); }
    s.appendChild(side);
    d.appendChild(s);
    var body = el('div', 'g-body');
    d.appendChild(body);
    var rendered = false;
    d.addEventListener('toggle', function () { if (d.open && !rendered) { rendered = true; renderBody(g, body); } });
    if (openIt) d.open = true;
    return d;
  }

  function apply(fromUser) {
    document.querySelectorAll('#chips .chip').forEach(function (b) { b.classList.toggle('on', b.dataset.k === state.outcome); });
    document.querySelectorAll('#groupby .chip').forEach(function (b) { b.classList.toggle('on', b.dataset.k === state.groupBy); });
    document.querySelectorAll('#tiles .tile').forEach(function (b) { b.classList.toggle('active', b.dataset.k === state.outcome && state.outcome !== 'all'); });
    if (fromUser) writeHash();

    var list = tests.filter(matches);
    var map = new Map();
    list.forEach(function (t) {
      var k = groupKey(t);
      var g = map.get(k);
      if (!g) {
        g = { items: [], f: 0, p: 0, s: 0 };
        if (state.groupBy === 'resource') {
          g.title = t.resource || '(no resource)'; g.crumb = [t.resourceType, t.rg, t.subscription].filter(Boolean).join('  ·  '); g.portal = t.resourceId;
        } else if (state.groupBy === 'file') {
          g.title = t.file; g.crumb = '';
        } else {
          g.title = t.check || t.block; g.crumb = (D.files.length > 1 ? t.file + '  ›  ' : '') + (t.check ? t.block : ''); g.link = t.ruleLink; g.severity = t.severity;
        }
        map.set(k, g);
      }
      g.items.push(t);
      if (t.result === 'Failed') g.f++; else if (t.result === 'Passed') g.p++; else g.s++;
    });
    var groups = Array.from(map.values());
    groups.forEach(function (g) { g.items.sort(function (a, b) { return (a.result === 'Failed' ? 0 : 1) - (b.result === 'Failed' ? 0 : 1) || a.order - b.order; }); });
    // Failing groups first, most failures first; then in the order they ran.
    groups.sort(function (a, b) { return (b.f > 0) - (a.f > 0) || b.f - a.f || a.items[0].order - b.items[0].order; });

    var host = $('groups');
    host.textContent = '';
    D.files.filter(function (f) { return f.broken; }).forEach(function (f) {
      var card = el('div', 'card broken');
      card.appendChild(el('h2', null, f.name + ' could not be loaded'));
      var m = el('div', 'msg open'); m.textContent = f.error; card.appendChild(m);
      host.appendChild(card);
    });
    if (!groups.length) {
      host.appendChild(el('div', 'none', tests.length ? 'Nothing matches these filters.' : (D.onlyFailedListed ? 'No test failed - only failed tests are listed in this report.' : 'No tests ran.')));
    }
    var opened = 0;
    var frag = document.createDocumentFragment();
    groups.forEach(function (g) {
      var openIt = (state.q || state.outcome !== 'all' || state.sev) ? opened < 12 : (g.f > 0 && opened < 6);
      if (openIt) opened++;
      frag.appendChild(groupCard(g, openIt));
    });
    host.appendChild(frag);

    var st = $('status');
    st.textContent = '';
    var b = el('b', null, fmt(list.length));
    st.appendChild(b);
    st.appendChild(document.createTextNode(' of ' + plural(tests.length, 'listed test') + ' in ' + plural(groups.length, 'group')));
    if (D.onlyFailedListed) st.appendChild(document.createTextNode(' · only failed tests were written to this report'));
    if (state.q) {
      var af = el('span', 'active-filter'); af.appendChild(document.createTextNode('"' + state.q + '"'));
      var x = el('button', null, '×'); x.type = 'button'; x.title = 'Clear search';
      x.addEventListener('click', function () { state.q = ''; $('q').value = ''; apply(true); });
      af.appendChild(x); st.appendChild(af);
    }
  }

  window.addEventListener('beforeprint', function () { document.querySelectorAll('details.group').forEach(function (d) { d.open = true; }); });

  // --- Footer ---------------------------------------------------------------------------------------
  var foot = $('footer');
  foot.appendChild(document.createTextNode('Generated by '));
  var link = el('a', null, 'Azure.Admin.Console'); link.href = 'https://github.com/ChendrayanV/Azure.Admin.Console'; link.target = '_blank'; link.rel = 'noopener noreferrer';
  foot.appendChild(link);
  foot.appendChild(document.createTextNode(' ' + D.moduleVersion + ' · ' + D.environment));

  readHash();
  apply(false);
})();
</script>
</body>
</html>
