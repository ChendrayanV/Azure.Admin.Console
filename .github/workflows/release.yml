# Publishes a new version to the PowerShell Gallery - only when a version tag
# is pushed, and only when that version is genuinely new. Ordinary pushes and
# pull requests never publish (they run ci.yml only).
#
#   1. gate     checks, with no secrets and no approval needed:
#                 - the tag (v1.2.3) matches ModuleVersion in the manifest
#                 - the tagged commit is on main
#                 - CHANGELOG.md has a "## v1.2.3" entry
#                 - the version is higher than the one on the PowerShell
#                   Gallery (a published version can never be replaced)
#               Any failed check stops the run before anything else happens,
#               and the run summary shows which.
#   2. release  waits for approval in the "psgallery" environment, then runs
#               the tests, builds and publishes the package, and creates a
#               GitHub release with the CHANGELOG entry and the package zip.
#
# Setup, once (repository Settings):
#   - Environments > New environment "psgallery":
#       Required reviewers: yourself, so every publish waits for approval.
#       Deployment branches and tags: "Selected", add the tag rule "v*".
#   - Add the secret PSGALLERY_API_KEY to that environment (an API key from
#     powershellgallery.com with Push permission, scoped to Azure.Admin.Console).
#
# To release:
#   1. Bump ModuleVersion in Azure.Admin.Console.psd1 and add "## v1.2.3" to
#      CHANGELOG.md, then merge to main.
#   2. git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  gate:
    name: Is ${{ github.ref_name }} a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the full history, to check the tag is on main

      - name: Check the version
        id: check
        run: |
          $name = 'Azure.Admin.Console'
          $data = Import-PowerShellDataFile "./$name.psd1"
          $version = [version]$data.ModuleVersion
          # A pre-release: PSData Prerelease = 'preview1' -> 0.14.6-preview1, tag v0.14.6-preview1.
          $prerelease = if ($data.PrivateData.PSData.Contains('Prerelease')) { [string]$data.PrivateData.PSData['Prerelease'] } else { '' }
          $full = if ($prerelease) { "$version-$prerelease" } else { "$version" }
          $checks = [System.Collections.Generic.List[object]]::new()
          $add = { param($Check, [bool] $Ok, $Detail) $checks.Add([pscustomobject]@{ Check = $Check; Ok = $Ok; Detail = $Detail }) }

          & $add 'Tag matches the manifest' ($env:GITHUB_REF_NAME -eq "v$full") "tag $env:GITHUB_REF_NAME, manifest $full"

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          & $add 'Tagged commit is on main' ($LASTEXITCODE -eq 0) "commit $($env:GITHUB_SHA.Substring(0, 7))"

          $hasEntry = [bool](Select-String -Path ./CHANGELOG.md -Pattern "^## v$([regex]::Escape("$version"))\s*$" -Quiet)
          & $add 'CHANGELOG.md has an entry' $hasEntry "## v$version"

          # Nothing found means this is the first release.
          $published = Find-PSResource -Name $name -Repository PSGallery -ErrorAction SilentlyContinue | Sort-Object Version -Descending | Select-Object -First 1
          $newer = -not $published -or $version -gt [version]"$($published.Version)"
          & $add 'Newer than the PowerShell Gallery' $newer $(if ($published) { "Gallery has $($published.Version)" } else { 'not on the Gallery yet' })
          # The same version can be published once: each pre-release label, and the stable release.
          $same = Find-PSResource -Name $name -Version "$version" -Prerelease -Repository PSGallery -ErrorAction SilentlyContinue | Where-Object { "$($_.Version)$(if ($_.Prerelease) { "-$($_.Prerelease)" })" -eq $full }
          & $add 'Not published yet' (-not $same) $(if ($same) { "$full is already on the Gallery" } else { "$full is new" })

          $summary = @('| Check | | Detail |', '|---|---|---|')
          foreach ($c in $checks) {
              $summary += "| $($c.Check) | $(if ($c.Ok) { '✅' } else { '❌' }) | $($c.Detail) |"
              if (-not $c.Ok) { Write-Output "::error::$($c.Check): $($c.Detail)" }
          }
          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY

          if (@($checks | Where-Object { -not $_.Ok }).Count -gt 0) {
              Write-Output "::error::$name $version will not be published - see the checks above."
              exit 1
          }
          "version=$full" >> $env:GITHUB_OUTPUT
          "base=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  release:
    name: Publish ${{ github.ref_name }}
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write   # to create the GitHub release
    environment:
      name: psgallery
      url: https://www.powershellgallery.com/packages/Azure.Admin.Console/${{ needs.gate.outputs.version }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BASE: ${{ needs.gate.outputs.base }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the build and test modules
        run: |
          # -TrustRepository rather than Set-PSResourceRepository: on a fresh
          # runner the repository store doesn't exist yet, and
          # Set-PSResourceRepository fails before anything creates it.
          Install-PSResource -Name Pester -Version '[6.2.0,7.0)' -Scope CurrentUser -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Scope CurrentUser -TrustRepository -Quiet
          # A required module: the package's clean-import check needs it.
          Install-PSResource -Name PSRule.Rules.Azure -Version '[1.47.0,2.0)' -Scope CurrentUser -TrustRepository -Quiet

      - name: Test and build
        run: ./build.ps1 -Task Test, Build

      - name: Publish to the PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./build.ps1 -Task Publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's CHANGELOG section, up to the next "## " heading.
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## v$([regex]::Escape($env:BASE))\s*$\s*(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Azure.Admin.Console $env:VERSION" }
          $notes += if ($env:PRERELEASE) { "`n`nA pre-release. Install: ``Install-PSResource -Name Azure.Admin.Console -Version $env:VERSION -Prerelease``" } else { "`n`nInstall: ``Install-PSResource -Name Azure.Admin.Console -Version $env:VERSION``" }
          Set-Content -Path ./release-notes.md -Value $notes -Encoding utf8NoBOM

          $zip = "Azure.Admin.Console-$env:VERSION.zip"
          Compress-Archive -Path ./out/Azure.Admin.Console -DestinationPath $zip
          $flags = @(if ($env:PRERELEASE) { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME $zip --title "Azure.Admin.Console $env:VERSION" --notes-file ./release-notes.md @flags
